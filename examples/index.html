<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mermaid-bpmn playground</title>
    <style>
      /* Light is the default, independent of the OS/browser setting — no
         prefers-color-scheme here. The toggle button flips html[data-theme]. */
      :root {
        color-scheme: light;
        --bg: #fff;
        --fg: #222;
        --border: #ddd;
        --panel-bg: #fafafa;
        --code-bg: #f6f6f6;
        --code-inline-bg: #f0f0f0;
        --muted: #666;
        --faint: #999;
        --link: #06c;
        --error: #b00;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --bg: #1a1a1a;
        --fg: #e4e4e4;
        --border: #444;
        --panel-bg: #242424;
        --code-bg: #2a2a2a;
        --code-inline-bg: #333;
        --muted: #aaa;
        --faint: #888;
        --link: #6cb6ff;
        --error: #ff8a8a;
      }
      body {
        font-family: 'trebuchet ms', sans-serif;
        margin: 2rem;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        font-size: 1.3rem;
      }
      .theme-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 10;
        font: inherit;
        font-size: 0.85rem;
        padding: 0.35rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel-bg);
        color: var(--fg);
        cursor: pointer;
      }
      .theme-toggle:hover {
        border-color: var(--faint);
      }
      .case {
        border: 1px solid var(--border);
        border-radius: 6px;
        margin: 1rem 0;
        padding: 1rem;
      }
      /* Caption row: the title on the left, the Copy / Edit buttons on the right,
         so the toolbar adds no vertical height of its own. */
      .case-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .case h2 {
        font-size: 1rem;
        margin: 0;
      }
      .case pre {
        background: var(--code-bg);
        padding: 0.5rem 0.75rem;
        border-radius: 4px;
        font-size: 0.85rem;
        overflow-x: auto;
        margin: 0;
      }
      /* Snippet toolbar: Copy / Edit sit at the right end of the caption row. */
      .snippet-bar {
        display: flex;
        justify-content: flex-end;
        gap: 0.4rem;
        flex: none;
      }
      .snippet-btn {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.2rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--panel-bg);
        color: var(--fg);
        cursor: pointer;
      }
      .snippet-btn:hover {
        border-color: var(--faint);
      }
      .snippet-btn.active {
        border-color: var(--link);
        color: var(--link);
      }
      /* The edit box replaces the <pre> in place and matches its look. */
      .snippet-edit {
        display: block;
        width: 100%;
        box-sizing: border-box;
        background: var(--code-bg);
        color: var(--fg);
        border: 1px solid var(--link);
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        font-family: ui-monospace, 'Cascadia Code', 'Consolas', 'Courier New', monospace;
        font-size: 0.85rem;
        line-height: 1.4;
        resize: vertical;
        white-space: pre;
        overflow-wrap: normal;
        overflow-x: auto;
        tab-size: 2;
      }
      .snippet-edit:focus {
        outline: none;
      }
      .render {
        margin-top: 0.75rem;
      }
      .error {
        color: var(--error);
        white-space: pre-wrap;
      }
      .toc {
        border: 1px solid var(--border);
        border-radius: 6px;
        margin: 1rem 0;
        padding: 0.75rem 1rem;
        background: var(--panel-bg);
      }
      .toc h2 {
        font-size: 0.95rem;
        margin: 0 0 0.5rem;
      }
      .toc ul {
        margin: 0;
        padding-left: 1.25rem;
      }
      .toc ul.two-col {
        columns: 2;
      }
      .toc a {
        color: var(--link);
        text-decoration: none;
      }
      .toc a:hover {
        text-decoration: underline;
      }
      .toc .pending {
        color: var(--faint);
      }
      .filter-note {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .filter-note code {
        background: var(--code-inline-bg);
        padding: 0 0.25rem;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <button id="theme-toggle" class="theme-toggle" type="button">🌙 Dark</button>
    <h1>mermaid-bpmn playground</h1>
    <p>
      Edit <code>examples/cases.js</code>, then refresh.
      <a class="nav" href="https://github.com/derari/mermaid-bpmn#readme">[readme]</a>
      See also the <a href="./editor.html">live editor</a> and <a href="https://derari.github.io/mermaid-fmc">FMC</a>.
    </p>
    <p class="filter-note">
      Tip: add <code>?select=icon</code> to the URL to show only examples matching a
      (case-insensitive) regex.
    </p>
    <div id="toc" class="toc" hidden>
      <h2>Examples</h2>
      <ul id="toc-list"></ul>
    </div>
    <div id="cases"></div>

    <script type="module">
      import mermaid from 'mermaid';
      import bpmn, { registerIconPacks } from '../src/index.ts';
      import { cases } from './cases.js';

      mermaid.registerExternalDiagrams([bpmn]);

      // The Iconify packs `icon:<name>:<icon>` can draw from; the value is the
      // `@iconify-json/<pkg>` package. We register only the packs the visible
      // cases actually reference (below) rather than the whole catalog, because
      // ensureLoaded (see src/icons.ts) fetches every *registered* loader on the
      // first icon — so a registered-but-unused pack would be fetched too.
      const ICON_PACKS = {
        lucide: 'lucide',
        nonicons: 'nonicons',
        devicon: 'devicon-plain',
        fa: 'fa7-regular',
        'fa-brands': 'fa7-brands',
        mdi: 'mdi',
      };

      const container = document.getElementById('cases');
      const tocList = document.getElementById('toc-list');

      // Optional ?select=<regex> filter: keep only cases whose title or code
      // matches the (case-insensitive) regex. Falls back to showing everything
      // if the pattern is invalid.
      const selectParam = new URLSearchParams(location.search).get('select');
      let selectRe = null;
      if (selectParam) {
        try {
          selectRe = new RegExp(selectParam, 'i');
        } catch (err) {
          const note = document.createElement('p');
          note.className = 'error';
          note.textContent = `Invalid ?select regex: ${err.message}`;
          container.before(note);
        }
      }

      const slugCounts = new Map();
      const slugFor = (title) => {
        let base = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        if (!base) base = 'case';
        const n = slugCounts.get(base) ?? 0;
        slugCounts.set(base, n + 1);
        return n === 0 ? base : `${base}-${n}`;
      };

      const visible = cases.filter(
        (c) => !selectRe || selectRe.test(c.title) || selectRe.test(c.code),
      );

      if (visible.length) {
        document.getElementById('toc').hidden = false;
      }
      if (visible.length >= 8) {
        tocList.classList.add('two-col');
      }

      // Register only the packs the visible cases actually use (scanned from their
      // `icon:<pack>:` references), so no unused pack's JSON is ever fetched.
      const usedPacks = new Set();
      for (const c of visible) {
        for (const m of c.code.matchAll(/\bicon:([\w-]+):/g)) {
          if (ICON_PACKS[m[1]]) usedPacks.add(m[1]);
        }
      }
      registerIconPacks(
        [...usedPacks].map((name) => ({
          name,
          loader: () =>
            fetch(`https://cdn.jsdelivr.net/npm/@iconify-json/${ICON_PACKS[name]}/icons.json`).then(
              (r) => r.json(),
            ),
        })),
      );

      // Pass 1: lay out the whole page synchronously — every TOC entry (as a
      // non-clickable placeholder) and every case skeleton — so the reader sees
      // the full outline immediately, before any (potentially slow) render runs.
      const items = visible.map((c, i) => {
        const slug = slugFor(c.title);

        const tocLabel = document.createElement('span');
        tocLabel.className = 'pending';
        tocLabel.textContent = c.title;
        const li = document.createElement('li');
        li.appendChild(tocLabel);
        tocList.appendChild(li);

        const section = document.createElement('div');
        section.className = 'case';
        section.id = slug;

        // Caption row: the title and, at its right end, the Copy / Edit toolbar,
        // so the buttons sit level with the heading and add no vertical height.
        const head = document.createElement('div');
        head.className = 'case-head';

        const h2 = document.createElement('h2');
        h2.textContent = c.title;
        head.appendChild(h2);

        // Per-snippet toolbar: Copy (to clipboard) and Edit (toggle a live text
        // box). The buttons are wired up after the item record exists (below).
        const bar = document.createElement('div');
        bar.className = 'snippet-bar';
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'snippet-btn';
        copyBtn.textContent = 'Copy';
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'snippet-btn';
        editBtn.textContent = 'Edit';
        bar.append(copyBtn, editBtn);
        head.appendChild(bar);
        section.appendChild(head);

        const pre = document.createElement('pre');
        pre.textContent = c.code;
        section.appendChild(pre);

        const render = document.createElement('div');
        render.className = 'render';
        section.appendChild(render);
        container.appendChild(section);

        // `code` is the live source of truth (starts as the case's code, then
        // tracks edits); `pre` is swapped for a textarea while editing.
        const item = { c, i, slug, li, tocLabel, render, pre, copyBtn, editBtn, code: c.code, textarea: null };
        wireToolbar(item);
        return item;
      });

      // Renders one case's current `code` into its render slot. Every call uses a
      // fresh, globally-unique id so a live edit never collides with an earlier
      // render's ids. Renders are async and a fast typist can start several before
      // the first finishes, so each call stamps a token and only the newest one for
      // an item is allowed to write — a slow earlier render can't clobber a newer
      // one. Errors are shown in place rather than thrown.
      let renderSeq = 0;
      async function renderOne(item) {
        const token = (item.renderToken = (item.renderToken ?? 0) + 1);
        try {
          const { svg } = await mermaid.render(`bpmn-${renderSeq++}`, item.code);
          if (item.renderToken === token) item.render.innerHTML = svg;
        } catch (err) {
          if (item.renderToken === token) {
            item.render.innerHTML = `<div class="error">${String(
              err && err.stack ? err.stack : err,
            )}</div>`;
          }
        }
      }

      // Briefly swaps a button's label (e.g. "Copied!") then restores it.
      function flash(btn, text) {
        const original = btn.dataset.label ?? btn.textContent;
        btn.dataset.label = original;
        btn.textContent = text;
        clearTimeout(btn._flashTimer);
        btn._flashTimer = setTimeout(() => {
          btn.textContent = btn.dataset.label;
        }, 1200);
      }

      // Grows a textarea to fit its content so the whole snippet stays visible.
      function autoSize(ta) {
        ta.style.height = 'auto';
        ta.style.height = `${ta.scrollHeight + 2}px`;
      }

      // Wires the Copy and Edit buttons for one case. Copy writes the live `code`
      // to the clipboard. Edit swaps the <pre> for a textarea that re-renders the
      // diagram live (debounced) as it is typed; clicking again restores the <pre>.
      // Copies text to the clipboard, preferring the async Clipboard API and
      // falling back to a hidden-textarea execCommand for non-secure contexts or
      // browsers that reject it. Returns whether either path succeeded.
      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            return ok;
          } catch {
            return false;
          }
        }
      }

      function wireToolbar(item) {
        item.copyBtn.addEventListener('click', async () => {
          flash(item.copyBtn, (await copyText(item.code)) ? 'Copied!' : 'Copy failed');
        });

        item.editBtn.addEventListener('click', () => {
          if (item.textarea) {
            // Leave edit mode: replace the textarea with a fresh <pre>.
            const pre = document.createElement('pre');
            pre.textContent = item.code;
            item.textarea.replaceWith(pre);
            item.pre = pre;
            item.textarea = null;
            item.editBtn.textContent = 'Edit';
            item.editBtn.classList.remove('active');
            return;
          }
          // Enter edit mode: replace the <pre> with a live textarea.
          const ta = document.createElement('textarea');
          ta.className = 'snippet-edit';
          ta.value = item.code;
          ta.spellcheck = false;
          item.pre.replaceWith(ta);
          item.textarea = ta;
          item.editBtn.textContent = 'Done';
          item.editBtn.classList.add('active');
          autoSize(ta);
          ta.focus();
          let debounce;
          ta.addEventListener('input', () => {
            item.code = ta.value;
            autoSize(ta);
            clearTimeout(debounce);
            debounce = setTimeout(() => renderOne(item), 250);
          });
        });
      }

      // Pass 2: render every case. Re-runnable so the theme toggle can re-render
      // the whole page with new mermaid theme variables. On the first pass, swap
      // each TOC placeholder for a real anchor once its case loads.
      async function renderAll() {
        for (const item of items) {
          await renderOne(item);

          if (!item.linked) {
            const link = document.createElement('a');
            link.href = `#${item.slug}`;
            link.textContent = item.c.title;
            item.li.replaceChild(link, item.tocLabel);
            item.linked = true;
          }
        }
      }

      // Theme: light is the default (set below), regardless of the OS setting. The
      // toggle flips the page chrome (html[data-theme]) and mermaid's own theme,
      // then re-renders. The playground uses mermaid's built-in light/dark themes;
      // bpmn reads its fill/stroke palette from each theme (see src/theme.ts).
      const THEMES = { light: 'default', dark: 'dark' };
      const toggle = document.getElementById('theme-toggle');
      let theme = 'light';
      async function setTheme(mode) {
        theme = mode;
        document.documentElement.dataset.theme = mode;
        toggle.textContent = mode === 'dark' ? '☀ Light' : '🌙 Dark';
        mermaid.initialize({ startOnLoad: false, theme: THEMES[mode] });
        await renderAll();
      }
      toggle.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));

      await setTheme('light');
    </script>
  </body>
</html>
